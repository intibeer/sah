name: checks
on: [push, pull_request]
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
  workers-probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/workers-probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/workers-probe/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
